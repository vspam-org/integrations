# Scores for the vspam.org symbols.
#
# Install to: data/conf/rspamd/local.d/groups.conf
# Merge into an existing `group "vspam"` block if you already have one.
#
# These are starting weights, not recommendations for every deployment.
# mailcow rejects at 15 by default and greylists around 4, so a phishing hit
# below contributes strongly without rejecting on its own — a single list
# should rarely be the only reason a message is refused.
#
# Run these at 0.0 for a week first and read the Rspamd history before letting
# them affect delivery. Anything that surprises you is worth a delist request
# (https://vspam.org/delist — reviewed within 48 hours, no account needed)
# before you tune the number down.

group "vspam" {
  description = "vspam.org community phishing intelligence";

  symbols {
    # Direct evidence against a named artifact — the strongest surface.
    "RBL_VSPAM_PHISHING" {
      weight = 6.0;
      description = "Listed on vspam.org as phishing";
    }
    "RBL_VSPAM_MALWARE" {
      weight = 6.0;
      description = "Listed on vspam.org as malware distribution";
    }
    "RBL_VSPAM_BOTNET" {
      weight = 5.0;
      description = "Listed on vspam.org as botnet command and control";
    }
    "RBL_VSPAM_SPAM" {
      weight = 3.0;
      description = "Listed on vspam.org as a spam source";
    }
    # Tor exit nodes are not evidence of abuse on their own; plenty of
    # legitimate mail leaves through one. Context only.
    "RBL_VSPAM_TOR" {
      weight = 0.5;
      description = "Listed on vspam.org as a Tor exit node";
    }
    "RBL_VSPAM_THREAT" {
      weight = 2.0;
      description = "Listed on vspam.org as an aggregated threat indicator";
    }
    # Fallback for a listing whose category did not resolve to a return code.
    "RBL_VSPAM" {
      weight = 2.0;
      description = "Listed on vspam.org";
    }
  }
}
