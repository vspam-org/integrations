# vspam.org DNSBL for mailcow's bundled Rspamd.
#
# Install to: data/conf/rspamd/local.d/rbl.conf
# If that file already exists, merge the `vspam` block into your existing
# `rbls { ... }` rather than overwriting — mailcow ships its own entries there.
#
# Then: docker compose restart rspamd-mailcow
#
# This path needs no agent and no API key. It resolves through whatever
# resolver Rspamd already uses. Run the agent alongside it (see
# ../docker-compose.override.yml) when you also want local caching and
# automatic reporting of what this server sees.

rbls {
  vspam {
    symbol = "RBL_VSPAM";
    rbl = "dnsbl.vspam.org";
    # The published IPv6 surface is the reason to run this list; resolving
    # only A records would discard most of what it knows.
    ipv6 = true;
    from = true;
    received = true;
    returncodes {
      RBL_VSPAM_PHISHING = "127.0.0.2";
      RBL_VSPAM_MALWARE  = "127.0.0.3";
      RBL_VSPAM_BOTNET   = "127.0.0.4";
      RBL_VSPAM_SPAM     = "127.0.0.5";
      RBL_VSPAM_TOR      = "127.0.0.6";
      RBL_VSPAM_THREAT   = "127.0.0.7";
    }
  }
}
