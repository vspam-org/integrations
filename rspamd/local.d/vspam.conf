# vspam.org module options.
#
# Install to: $LOCAL_CONFDIR/local.d/vspam.conf  (usually /etc/rspamd/local.d/)
#
# Bare keys, no wrapping section — the `vspam { }` block lives in
# rspamd.conf.local, matching how every bundled Rspamd module is configured.
# Every key here has the same default in the plugin, so an empty file, or no
# file at all, is a valid configuration.
#
# Then: rspamadm configtest && systemctl reload rspamd

# Where the local agent listens. Leave as-is for a host install; point it at
# the service name when Rspamd and the agent are separate containers, e.g.
#   agent_url = "http://vspam-agent:10046";
agent_url = "http://127.0.0.1:10046";

# Used when the agent does not answer. Only a SHA-256 of each indicator is
# sent, never the domain itself. Set fallback_to_api = false if you would
# rather a missing agent mean no checking at all.
api_url = "https://api.vspam.org";
fallback_to_api = true;

# Optional. Raises the rate limit on the API fallback path and attributes what
# this server reports. Get one free at https://vspam.org/account.
# api_key = "vspam_your_key_here";

# Seconds to stop calling the agent for after a refused connection, so a
# stopped agent does not cost every message a connect timeout.
agent_cooldown = 60;

# What to look up. The agent covers all three in a single request.
check_sender_domain = true;
check_client_ip = true;
check_urls = true;
max_urls = 10;

# Total budget per lookup. Both transports fail open when it expires.
timeout = 2.0;

# Rspamd's shared convention. Off means messages from your own networks and
# from authenticated submitters are not checked against a public blocklist.
check_local = false;
check_authed = false;
