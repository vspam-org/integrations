# Weights for the vspam.org module symbols.
#
# Install to: $LOCAL_CONFDIR/local.d/groups.conf
# Merge into an existing file rather than overwriting it — this is a shared
# file and replacing it will drop the weights of every other group you tune.
#
# The plugin already registers these defaults itself, so this file is only
# needed to change them. It exists because groups.conf is where Rspamd
# operators expect to find weights, and because starting at zero is the right
# way to adopt a new list.
#
# These match the DNSBL return-code weights in ../../mailcow/scores.conf, so
# moving from the DNS path to this module does not reweight your mail.
#
# Rspamd's default reject threshold is 15 and greylist around 4, so a phishing
# hit contributes strongly without rejecting on its own. One list should
# rarely be the only reason a message is refused.
#
# Run at 0.0 for a week and read the history first. Anything that surprises
# you is worth a delist request (https://vspam.org/delist — reviewed within
# 48 hours, no account needed) before you tune the number down.

group "vspam" {
  description = "vspam.org community phishing intelligence";

  symbols {
    # Direct evidence against a named artifact — the strongest surface.
    "VSPAM_PHISHING" {
      weight = 6.0;
      description = "Listed on vspam.org as phishing";
    }
    "VSPAM_MALWARE" {
      weight = 6.0;
      description = "Listed on vspam.org as malware distribution";
    }
    "VSPAM_BOTNET" {
      weight = 5.0;
      description = "Listed on vspam.org as botnet command and control";
    }
    "VSPAM_SPAM" {
      weight = 3.0;
      description = "Listed on vspam.org as a spam source";
    }
    # Tor exit nodes are not evidence of abuse on their own; plenty of
    # legitimate mail leaves through one. Context only.
    "VSPAM_TOR" {
      weight = 0.5;
      description = "Listed on vspam.org as a Tor exit node";
    }
    "VSPAM_THREAT" {
      weight = 2.0;
      description = "Listed on vspam.org as an aggregated threat indicator";
    }

    # Scored as suspicious but deliberately not published to the blocklist.
    # A DNSBL return code cannot express this; the module can. Small weight —
    # it is a nudge for the rest of your rules to add up against, not a verdict.
    "VSPAM_SUSPICIOUS" {
      weight = 1.5;
      description = "Scored suspicious by vspam.org but not published to the blocklist";
    }

    # Fires when neither the agent nor the API could be reached. Weight 0 by
    # design: this is how you notice the lookup is broken, in the history and
    # in your metrics, without it ever affecting delivery.
    "VSPAM_FAIL" {
      weight = 0.0;
      description = "vspam.org lookup failed; message was not checked";
    }
  }
}
