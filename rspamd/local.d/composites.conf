# Optional: only needed if you run BOTH the vspam.org module and the vspam.org
# DNSBL (local.d/rbl.conf) at the same time.
#
# Install to: $LOCAL_CONFDIR/local.d/composites.conf
# Merge into an existing file rather than overwriting it.
#
# Without this, a listed indicator scores twice — once from the DNS answer and
# once from the module — because both are reading the same finding. Each
# composite here collapses the pair back to a single weight. The two symbols
# stay visible in the history so you can still see which path saw it.
#
# You do not need this file if you run only one of the two paths, which is the
# recommended setup.

VSPAM_DUP_PHISHING {
  expression = "VSPAM_PHISHING & RBL_VSPAM_PHISHING";
  description = "Listed as phishing by both the vspam.org module and its DNSBL";
  policy = "remove_weight";
  score = 6.0;
}
VSPAM_DUP_MALWARE {
  expression = "VSPAM_MALWARE & RBL_VSPAM_MALWARE";
  description = "Listed as malware by both the vspam.org module and its DNSBL";
  policy = "remove_weight";
  score = 6.0;
}
VSPAM_DUP_BOTNET {
  expression = "VSPAM_BOTNET & RBL_VSPAM_BOTNET";
  description = "Listed as botnet C2 by both the vspam.org module and its DNSBL";
  policy = "remove_weight";
  score = 5.0;
}
VSPAM_DUP_SPAM {
  expression = "VSPAM_SPAM & RBL_VSPAM_SPAM";
  description = "Listed as a spam source by both the vspam.org module and its DNSBL";
  policy = "remove_weight";
  score = 3.0;
}
VSPAM_DUP_TOR {
  expression = "VSPAM_TOR & RBL_VSPAM_TOR";
  description = "Listed as a Tor exit node by both the vspam.org module and its DNSBL";
  policy = "remove_weight";
  score = 0.5;
}
VSPAM_DUP_THREAT {
  expression = "VSPAM_THREAT & RBL_VSPAM_THREAT";
  description = "Listed as a threat indicator by both the vspam.org module and its DNSBL";
  policy = "remove_weight";
  score = 2.0;
}
